<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swing-o-meter mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;src:url('../../public/fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;src:url('../../public/fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;src:url('../../public/fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:700;src:url('../../public/fonts/playfair-display-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:600;font-style:italic;src:url('../../public/fonts/playfair-display-latin-600-italic.woff2') format('woff2')}

:root{
  --ink:#1e1b17;--graphite:#535353;--dim:#666974;--parchment:#fbf6ea;--paper:#f7f0df;--card:#f3ecdb;
  --ivory:#fdfcf9;--hairline:#d9cfb8;--navy:#1b2f6b;--gold:#f29a2e;--brass:#c59b27;
  --approved:#1e7a4e;--approved-edge:#155b39;--approved-tint:#e8f5ee;
  --uc:#975e02;--uc-tint:#fef5e7;--ifm:#7c3a82;--rej:#b92b27;
  --surface:#fffcf4;--track:#e4dcc6;
}
.dark{
  --ink:#f4efe6;--graphite:#cfc8ba;--dim:#a9a396;--parchment:#14161c;--paper:#1b1e26;--card:#20242d;
  --ivory:#1b1e26;--hairline:#363b48;--navy:#9db4ff;--gold:#f29a2e;--brass:#e0b94a;
  --approved:#4fc08a;--approved-edge:#2f8f62;--approved-tint:#16301f;
  --uc:#e8a33a;--uc-tint:#2d2412;--ifm:#c78bce;--rej:#ef6f6a;
  --surface:#1b1e26;--track:#2c313d;
}
*{box-sizing:border-box}
body{margin:0;background:#cfc8b8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.stage{display:flex;gap:32px;padding:32px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.label{font:700 12px/1 'Plus Jakarta Sans';letter-spacing:.12em;text-transform:uppercase;color:#3d3d3d;margin:0 0 10px}
.frame{background:var(--parchment);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.frame.desktop{width:820px}
.frame.phone{width:375px}
.banner{background:linear-gradient(135deg,#155b39,#1e7a4e);color:#fff;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
.banner b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-decoration-color:rgba(255,255,255,.4);text-underline-offset:4px}
.banner i{display:block;font-size:12px;margin-top:4px;color:#e7efe9}
.banner .cost{font-size:24px;font-weight:700;text-align:right}
.banner .cost span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#e7efe9;font-weight:600}
.body{padding:20px 24px 28px}
.phone .body{padding:16px}
.crumbs{font-size:12px;color:var(--dim);margin-bottom:14px}
h1{font:700 34px/1.1 'Playfair Display',serif;margin:0 0 6px}
.phone h1{font-size:28px}
.meta{font-size:13px;color:var(--graphite);padding-bottom:16px;border-bottom:1px solid var(--hairline);margin-bottom:18px}
blockquote{margin:0 0 20px;border-left:4px solid var(--gold);padding:2px 0 2px 18px}
blockquote p{font:600 italic 22px/1.35 'Playfair Display',serif;margin:0}
.phone blockquote p{font-size:19px}
blockquote footer{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.faded{opacity:.55}
.faded .row{height:12px;border-radius:6px;background:var(--hairline);margin:8px 0}

/* --- the Swing-o-meter --- */
.swing{border:1px solid var(--hairline);border-radius:14px;background:var(--surface);padding:20px 22px 18px;margin:0 0 22px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.phone .swing{padding:16px 14px}
.swing-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px}
.swing h2{white-space:nowrap;font:700 20px/1.2 'Playfair Display',serif;margin:0;display:flex;align-items:center;gap:8px}
.swing .sub{font-size:12px;color:var(--dim)}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--hairline);color:var(--graphite);white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:center;margin-top:8px}
.phone .layout{grid-template-columns:1fr;gap:14px}
.gauge{width:100%;height:auto;display:block}
.headline{font:700 22px/1.2 'Playfair Display',serif;margin:0 0 4px}
.headline em{font-style:italic;color:var(--ifm)}
.explain{font-size:13px;color:var(--graphite);margin:0 0 14px;line-height:1.5}
.counts{display:flex;gap:18px;margin:0 0 16px;font-size:12px;color:var(--dim)}
.counts b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:12px;font-weight:600}
.phone .bars li{grid-template-columns:84px 1fr 34px}
.bars .track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bars .fill{height:100%;border-radius:99px;background:var(--navy)}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--graphite)}
.spark{margin-top:16px;padding-top:14px;border-top:1px dashed var(--hairline);display:flex;align-items:center;gap:14px}
.spark .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;white-space:nowrap}
.spark svg{flex:1;height:34px}
.fine{font-size:11px;color:var(--dim);margin:12px 0 0;line-height:1.5}
.legend{display:flex;gap:10px 16px;justify-content:center;font-size:11px;color:var(--dim);margin-top:2px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.polls{text-align:center;padding:10px 0 4px}
.polls .big{font:700 26px/1.2 'Playfair Display',serif;margin:0 0 6px}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--hairline)}
.dots i.on{background:var(--navy);border-color:var(--navy)}
.ledger-h{border-top:1px solid var(--hairline);padding-top:16px;font:700 20px 'Playfair Display',serif}
.card-chip{display:inline-block;background:var(--approved-tint);color:var(--approved);border:1px solid var(--approved);border-radius:999px;font-size:11px;font-weight:700;padding:3px 10px;margin-left:8px}
.venue-card{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--hairline);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.venue-card b{font:700 16px 'Playfair Display',serif}.card-chip{font-family:'Plus Jakarta Sans',sans-serif}
.venue-card small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.notes{max-width:1220px;margin:0 auto;padding:0 32px 32px;font-size:13px;line-height:1.6;color:#2d2d2d}
.legend .on{font-weight:700;color:var(--ink)}.legend .seal{width:14px;height:14px;border-radius:50%;background:var(--navy);color:var(--surface);font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}.stats{display:flex;gap:18px}
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
// Three verdicts, no Chairs' score: the Chairs' verdict is a BAND, not a point.
const CX = 200, CY = 190, R = 150, RI = 118;
const pt = (score, r) => { const a = Math.PI * (1 - score / 100); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
const arc = (a, b, r1, r2) => {
  const [x1, y1] = pt(a, r2), [x2, y2] = pt(b, r2), [x3, y3] = pt(b, r1), [x4, y4] = pt(a, r1);
  return `M${x1},${y1} A${r2},${r2} 0 0 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 0 0 ${x4},${y4}Z`;
};
const BANDS = [
  { key: 'rejected', label: 'Rejected', lo: 0, hi: 30, c: 'var(--rej)' },
  { key: 'ifwemust', label: 'If We Must', lo: 30, hi: 65, c: 'var(--ifm)' },
  { key: 'approved', label: 'Approved', lo: 65, hi: 100, c: 'var(--approved)' },
];
const band = (key) => BANDS.find(b => b.key === key);

// chairs: a band key, or null for a venue with no verdict yet (Under Consideration / To Be Assessed)
function gauge({ chairs, people, quorate = true, id, alt }) {
  const gap = 0.6;
  let s = `<svg class="gauge" viewBox="0 0 400 250" role="img" aria-labelledby="${id}-t"><title id="${id}-t">${alt}</title>`;
  for (const b of BANDS) {
    const mine = chairs === b.key;
    const dim = chairs && !mine ? 0.32 : (quorate ? 1 : 0.55);
    s += `<path d="${arc(b.lo + gap, b.hi - gap, RI, R)}" fill="${b.c}" opacity="${dim}"/>`;
    if (mine) s += `<path d="${arc(b.lo + gap, b.hi - gap, RI - 8, R + 8)}" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linejoin="round"/>`;
    const [lx, ly] = pt((b.lo + b.hi) / 2, RI + (R - RI) / 2);
    s += `<text x="${lx}" y="${ly + 3}" text-anchor="middle" font-size="${b.key==='ifwemust'?9.5:9}" font-weight="700" fill="#fff" opacity="${chairs && !mine ? .0 : 1}" style="paint-order:stroke;stroke:rgba(0,0,0,.25);stroke-width:2px">${mine ? '' : (chairs ? '' : '')}</text>`;
  }
  for (const v of [0, 30, 65, 100]) {
    const [x, y] = pt(v, R + 15);
    s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dim)">${v}</text>`;
  }
  if (chairs) {
    const b = band(chairs), [bx, by] = pt((b.lo + b.hi) / 2, R + 30);
    s += `<g transform="translate(${bx},${by})"><circle r="11" fill="var(--navy)"/><text y="4" text-anchor="middle" font-size="9" font-weight="700" fill="var(--surface)">C</text></g>`;
  }
  if (quorate) {
    const [nx, ny] = pt(people, RI - 22);
    s += `<line x1="${CX}" y1="${CY}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>`;
    s += `<circle cx="${CX}" cy="${CY}" r="11" fill="var(--ink)"/><circle cx="${CX}" cy="${CY}" r="4" fill="var(--surface)"/>`;
    s += `<text x="${CX}" y="${CY + 44}" text-anchor="middle" font-family="Playfair Display" font-weight="700" font-size="30" fill="var(--ink)">${people}</text>`;
  } else {
    s += `<circle cx="${CX}" cy="${CY}" r="9" fill="var(--hairline)"/>`;
    s += `<text x="${CX}" y="${CY + 40}" text-anchor="middle" font-family="Playfair Display" font-weight="700" font-size="20" fill="var(--dim)">No needle yet</text>`;
  }
  return s + '</svg>';
}

function legend(chairs) {
  const items = BANDS.map(b => {
    const mine = chairs === b.key;
    return `<span class="${mine ? 'on' : ''}"><i style="background:${b.c}"></i>${b.label}${mine ? ' <i class="seal" style="background:var(--navy)">C</i>' : ''}</span>`;
  }).join('');
  return `<div class="legend">${items}</div>` +
    (chairs ? `<div class="legend" style="margin-top:4px"><span><i class="seal" style="border-radius:50%">C</i>The Chairs' verdict: <b>${band(chairs).label}</b></span></div>` : '');
}

function series(people, chairs) {
  const start = people === 52 ? 72 : people - 4, w = [0,.5,-.5,1,.2,.9,.6,1.2,1,1.1,1];
  const out = Array.from({length: 11}, (_, i) => Math.round(start + (people - start) * (i / 10)));
  out[10] = people; return out;
}
function spark(chairs, people) {
  const sparkPts = series(people, chairs), first = sparkPts[0];
  const H = 44, y = s => H - (s - 20) * 0.55;
  const pts = sparkPts.map((v, i) => `${(i * 30)},${y(v).toFixed(1)}`).join(' ');
  let g = '';
  if (chairs) { const b = band(chairs); g = `<rect x="0" width="300" y="${y(b.hi).toFixed(1)}" height="${(y(b.lo) - y(b.hi)).toFixed(1)}" fill="${b.c}" opacity=".16"/><line x1="0" x2="300" y1="${y(b.lo).toFixed(1)}" y2="${y(b.lo).toFixed(1)}" stroke="var(--navy)" stroke-width="1.2" stroke-dasharray="3 4"/>`; }
  return `<div class="spark"><span class="t">Last 90 days</span>
   <svg viewBox="0 0 300 ${H}" preserveAspectRatio="none" style="height:44px" aria-label="People's score over 90 days: ${first} to ${people}${chairs && people < band(chairs).lo ? ", leaving the Chairs' band" : ''}">${g}
   <polyline fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" points="${pts}"/><circle cx="300" cy="${y(people).toFixed(1)}" r="3.5" fill="var(--ink)"/></svg>
   <span class="sub">${first} → ${people}</span></div>`;
}

const bars = `<ul class="bars" aria-label="Per-Article averages">
  <li><span>Quality</span><span class="track"><span class="fill" style="width:62%;display:block"></span></span><span class="v">3.1</span></li>
  <li><span>Value</span><span class="track"><span class="fill" style="width:50%;display:block"></span></span><span class="v">2.5</span></li>
  <li><span>Would return</span><span class="track"><span class="fill" style="width:44%;display:block"></span></span><span class="v">44%</span></li></ul>`;
const counts = `<div class="counts"><div><b>23</b>members</div><div><b>41</b>logs</div><div><b>44%</b>would return</div></div>`;

// state: 'dissent' (People outside the Chairs' band), 'concur' (inside), 'straw' (no verdict yet), 'polls' (below quorum)
function card({ id, state, chairs, people }) {
  const head = (chip) => `<div class="swing-head"><h2 id="${id}-h">${state === 'straw' ? "The People's Straw Poll" : 'The Swing-o-meter'}</h2><span class="chip">${chip}</span></div>`;
  if (state === 'polls') return `<section class="swing" aria-labelledby="${id}-h">${head('Polls Open')}
    <div class="layout"><div>${gauge({ chairs, people: 0, quorate: false, id, alt: `Polls open: 3 of 5 members. The Chairs approved this venue.` })}${legend(chairs)}</div>
    <div class="polls"><p class="big">Polls Open</p><p class="explain">3 of 5 members have logged a visit. The needle appears once five different members have.</p>
    <div class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div><a style="font-size:13px;font-weight:700;color:var(--navy)">Log your visit →</a></div></div></section>`;
  const pb = BANDS.find(b => people >= b.lo && people < b.hi || (people === 100 && b.hi === 100));
  let headline, explain, alt;
  if (state === 'straw') {
    headline = `The People lean <em style="color:${pb.c}">${pb.label}</em>`;
    explain = `People's score <b>${people}</b>. The Chairs have not ruled yet, so there is nothing to swing against. This is an early read, not a verdict.`;
    alt = `Straw poll: People's score ${people}, leaning ${pb.label}. The Chairs have not given a verdict.`;
  } else if (state === 'concur') {
    headline = `The People Concur`;
    explain = `People's score <b>${people}</b>, inside the Chairs' <b>${band(chairs).label}</b> band.`;
    alt = `People's score ${people}, inside the ${band(chairs).label} band. The People concur with the Chairs.`;
  } else {
    headline = `The People would have it <em style="color:${pb.c}">${pb.label}</em>`;
    explain = `People's score <b>${people}</b>, in the <b>${pb.label}</b> band. The Chairs approved it. <span class="sub">(Think: a rainy-day lunch, not a destination.)</span>`;
    alt = `People's score ${people}, in the ${pb.label} band. The Chairs' verdict is ${band(chairs).label}, so the People would rank it lower.`;
  }
  return `<section class="swing" aria-labelledby="${id}-h">${head(state === 'straw' ? 'Not a verdict' : 'Unofficial · not a verdict')}
   <div class="sub">${state === 'straw' ? 'Where members would place it while the Chairs decide' : "Where public opinion sits against the Chairs' verdict"}</div>
   <div class="layout"><div>${gauge({ chairs, people, id, alt })}${legend(chairs)}</div>
   <div><p class="headline">${headline}</p><p class="explain">${explain}</p>${counts}${bars}</div></div>
   ${spark(chairs, people)}
   <p class="fine">Based on logs from members who have eaten here. ${chairs ? "The Chairs' verdict stands; this is the People's opinion, shown alongside it." : 'The People can inform the Chairs, never decide for them.'}</p></section>`;
}

function page({ variant, dark = false, inner, tier = 'approved' }) {
  const t = tier === 'approved'
    ? { name: 'Approved', quote: 'The Highest Honour in Manchester Lunching: The Right to be Returned To', g: 'linear-gradient(135deg,#155b39,#1e7a4e)' }
    : { name: 'Under Consideration', quote: 'The Waiting Chamber of Judgement', g: 'linear-gradient(135deg,#714501,#975e02)' };
  return `<div><p class="label">${variant}</p>
  <div class="frame ${variant.includes('Phone') ? 'phone' : 'desktop'} ${dark ? 'dark' : ''}">
    <div class="banner" style="background:${t.g}"><div><b>${t.name}</b><i>“${t.quote}”</i></div><div class="cost">££<span>Mid-range</span></div></div>
    <div class="body"><div class="crumbs">Home › ${t.name} › Kiln &amp; Co.</div>
      <h1>Kiln &amp; Co.</h1><div class="meta">Northern Quarter · Wood-fired Italian</div>
      <blockquote><p>“Pizza worth leaving the desk for. The dough alone justifies the queue.”</p><footer>— The Chairs</footer></blockquote>
      ${inner}<div class="ledger-h">Inspection Ledger</div></div></div></div>`;
}

const chip = (txt, tone) => `<span class="card-chip" style="background:var(--surface);color:${tone};border-color:${tone}">${txt}</span>`;
document.getElementById('stage').innerHTML =
  page({ variant: 'Desktop · light · People outside the Chairs’ band', inner: card({ id: 'a', state: 'dissent', chairs: 'approved', people: 52 }) }) +
  page({ variant: 'Phone · light', inner: card({ id: 'b', state: 'dissent', chairs: 'approved', people: 52 }) }) +
  page({ variant: 'Desktop · dark', dark: true, inner: card({ id: 'c', state: 'dissent', chairs: 'approved', people: 52 }) }) +
  page({ variant: 'Phone · People concur', inner: card({ id: 'd', state: 'concur', chairs: 'approved', people: 81 }) }) +
  page({ variant: 'Desktop · no verdict yet (Under Consideration)', tier: 'uc', inner: card({ id: 'e', state: 'straw', chairs: null, people: 71 }) }) +
  page({ variant: 'Phone · below quorum', inner: card({ id: 'f', state: 'polls', chairs: 'approved' }) }) +
  `<div style="width:820px"><p class="label">Ledger / Near Me chips (quorate venues with a verdict only)</p>
   <div class="frame desktop" style="padding:18px;display:grid;gap:10px">
    <div class="venue-card"><div><b>Kiln &amp; Co.${chip('People: If We Must', 'var(--ifm)')}</b><small>Approved by the Chairs</small></div><span style="font-weight:700">££</span></div>
    <div class="venue-card"><div><b>Salt Yard${chip('The People Concur', 'var(--approved)')}</b><small>Approved by the Chairs</small></div><span style="font-weight:700">£</span></div>
    <div class="venue-card"><div><b>Dough Bros${chip('People: Approved', 'var(--approved)')}</b><small>If We Must · the People would promote it</small></div><span style="font-weight:700">£</span></div>
   </div></div>`;
</script>
</body>
</html>
